[package]
name = "roxide-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-call CLI binary and session bootstrapper for Roxide (roxide, R, Rscript, R CMD)"

[lib]
name = "roxide_cli"
path = "src/lib.rs"

[[bin]]
name = "roxide"
path = "src/main.rs"

[dependencies]
roxide-base = { workspace = true }
roxide-eval = { workspace = true }
roxide-gc = { workspace = true }
roxide-graphics = { workspace = true }
roxide-host = { workspace = true }
roxide-methods = { workspace = true }
roxide-pkg = { workspace = true }
roxide-stats = { workspace = true }
roxide-utils = { workspace = true }

[lints]
workspace = true
