[workspace]
resolver = "3"
members = [
    "crates/roxide-diag",
    "crates/roxide-host",
    "crates/roxide-gc",
    "crates/roxide-syntax",
    "crates/roxide-value",
    "crates/roxide-eval",
    "crates/roxide-cli",
    "crates/roxide-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dvgyl/roxide"

[workspace.dependencies]
roxide-diag = { path = "crates/roxide-diag" }
roxide-host = { path = "crates/roxide-host" }
roxide-gc = { path = "crates/roxide-gc" }
roxide-syntax = { path = "crates/roxide-syntax" }
roxide-value = { path = "crates/roxide-value" }
roxide-eval = { path = "crates/roxide-eval" }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
